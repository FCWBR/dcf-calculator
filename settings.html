<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Settings — IntrinsicValue</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #111210; --bg1: #181917; --bg2: #1e1f1d; --bg3: #252623;
  --border: #2a2b28; --border2: #353632;
  --text0: #e8e9e4; --text1: #9a9b96; --text2: #5a5b57;
  --lime: #c8f135; --lime-dim: rgba(200,241,53,0.10);
  --green: #4ade80; --red: #f87171;
  --mono: 'DM Mono', monospace; --serif: 'DM Serif Display', serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text0); font-family: var(--mono); font-size: 13px; line-height: 1.6; min-height: 100vh; }
#topbar { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-box { width: 28px; height: 28px; background: var(--lime); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 500; color: #111; }
.logo-text { font-size: 14px; color: var(--text0); }
#page { max-width: 800px; margin: 0 auto; padding: 64px 32px; }
.page-h1 { font-family: var(--serif); font-size: 42px; font-weight: 400; margin-bottom: 8px; }
.section { margin-bottom: 40px; }
.section-title { font-size: 14px; color: var(--lime); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 20px; }
.field { margin-bottom: 20px; }
.field label { display: block; font-size: 10px; color: var(--text2); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
.field-row { display: flex; gap: 10px; }
input { background: var(--bg3); border: 1px solid var(--border2); border-radius: 4px; color: var(--text0); padding: 12px; flex: 1; font-family: var(--mono); outline: none; }
input:focus { border-color: var(--lime); }
.btn { font-family: var(--mono); padding: 10px 20px; border-radius: 4px; cursor: pointer; border: none; font-weight: 500; transition: 0.2s; font-size: 12px; }
.btn-lime { background: var(--lime); color: #111; }
.btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--text1); }
.btn-ghost:hover { border-color: var(--lime); color: var(--lime); }
.badge { font-size: 9px; padding: 2px 6px; border-radius: 3px; margin-left: 8px; vertical-align: middle; }
.badge-req { background: rgba(248, 113, 113, 0.1); color: var(--red); border: 1px solid rgba(248, 113, 113, 0.2); }
.badge-opt { background: rgba(154, 155, 150, 0.1); color: var(--text1); border: 1px solid var(--border2); }
.status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; margin-top: 8px; }
.dot { width: 6px; height: 6px; border-radius: 50%; }
.save-banner { display: none; background: var(--lime-dim); border: 1px solid var(--lime); color: var(--lime); padding: 12px; border-radius: 4px; margin-bottom: 20px; text-align: center; }
</style>
</head>
<body>

<nav id="topbar">
  <a href="index.html" class="logo">
    <div class="logo-box">IV</div>
    <span class="logo-text">Intrinsic<b>Value</b></span>
  </a>
  <div class="topbar-right">
    <a href="index.html" style="color:var(--text2); text-decoration:none; font-size:11px;">← BACK TO TERMINAL</a>
  </div>
</nav>

<div id="page">
  <div id="save-banner" class="save-banner">✓ CONFIGURATION SAVED TO LOCAL STORAGE</div>

  <h1 class="page-h1">Settings</h1>
  <p style="color:var(--text1); margin-bottom: 40px; max-width: 500px;">Configure your API connections. Keys are stored locally in your browser and never touch our servers.</p>

  <section class="section">
    <div class="section-title">Data Provider: Massive</div>
    <div class="panel">
      <div class="field">
        <label>Massive API Key <span class="badge badge-req">Required</span></label>
        <div class="field-row">
          <input type="password" id="massive-key" placeholder="Paste your Massive API key">
          <button class="btn btn-ghost" onclick="toggleVis('massive-key')">SHOW</button>
        </div>
        <div id="massive-status" class="status-pill"></div>
      </div>
      
      <div class="field">
        <label>Cloudflare Proxy URL <span class="badge badge-req">Required</span></label>
        <input type="text" id="proxy-url" placeholder="https://your-worker.workers.dev">
        <p style="font-size:11px; color:var(--text2); margin-top:8px;">Bypasses CORS restrictions. Must point to api.massive.com.</p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-title">Fallback Provider: FMP</div>
    <div class="panel">
      <div class="field">
        <label>Financial Modeling Prep Key <span class="badge badge-opt">Optional</span></label>
        <div class="field-row">
          <input type="password" id="fmp-key" placeholder="Paste your FMP API key">
          <button class="btn btn-ghost" onclick="toggleVis('fmp-key')">SHOW</button>
        </div>
        <div id="fmp-status" class="status-pill"></div>
      </div>
    </div>
  </section>

  <div style="display:flex; gap:15px;">
    <button class="btn btn-lime" style="flex:1; padding:16px;" onclick="saveAll()">SAVE CONFIGURATION</button>
    <button class="btn btn-ghost" style="color:var(--red);" onclick="clearAll()">CLEAR ALL</button>
  </div>
</div>

<script>
const fields = {
  'massive-key': 'iv_massive_key',
  'proxy-url':   'iv_proxy_url',
  'fmp-key':     'iv_fmp_key',
};

// Load
Object.entries(fields).forEach(([id, key]) => {
  const val = localStorage.getItem(key) || '';
  if (val) document.getElementById(id).value = val;
});

function toggleVis(id) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}

function saveAll() {
  Object.entries(fields).forEach(([id, key]) => {
    const val = document.getElementById(id).value.trim();
    if (val) localStorage.setItem(key, val);
    else localStorage.removeItem(key);
  });
  
  const banner = document.getElementById('save-banner');
  banner.style.display = 'block';
  setTimeout(() => { banner.style.display = 'none'; }, 3000);
  renderStatus();
}

function clearAll() {
  if (confirm('Verwijder alle opgeslagen sleutels?')) {
    Object.values(fields).forEach(k => localStorage.removeItem(k));
    location.reload();
  }
}

function renderStatus() {
  const massive = localStorage.getItem('iv_massive_key');
  const fmp = localStorage.getItem('iv_fmp_key');
  
  document.getElementById('massive-status').innerHTML = massive 
    ? `<div class="dot" style="background:var(--green)"></div><span style="color:var(--green)">Connected</span>`
    : `<div class="dot" style="background:var(--text2)"></div><span>Not configured</span>`;
    
  document.getElementById('fmp-status').innerHTML = fmp 
    ? `<div class="dot" style="background:var(--green)"></div><span style="color:var(--green)">Connected</span>`
    : `<div class="dot" style="background:var(--text2)"></div><span>Optional</span>`;
}

renderStatus();
</script>
</body>
</html>
