<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>IntrinsicValue — Pro DCF Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ... (Houd je bestaande :root en CSS tot en met .scard, die waren perfect) ... */
:root {
  --bg: #111210; --bg1: #181917; --bg2: #1e1f1d; --bg3: #252623;
  --border: #2a2b28; --border2: #353632;
  --text0: #e8e9e4; --text1: #9a9b96; --text2: #5a5b57;
  --lime: #c8f135; --lime-dim: rgba(200,241,53,0.10);
  --green: #4ade80; --green-dim: rgba(74,222,128,0.10);
  --red: #f87171; --red-dim: rgba(248,113,113,0.10);
  --mono: 'DM Mono', monospace; --serif: 'DM Serif Display', serif;
}
/* Behoud alle styling uit je originele bestand hieronder */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text0); font-family: var(--mono); font-size: 13px; line-height: 1.6; min-height: 100vh; }
#topbar { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-box { width: 28px; height: 28px; background: var(--lime); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 500; color: #111; }
.logo-text { font-size: 14px; color: var(--text0); }
#page { max-width: 1160px; margin: 0 auto; padding: 72px 32px 100px; }
.hero-h1 { font-family: var(--serif); font-size: clamp(40px, 6vw, 70px); font-weight: 400; line-height: 1.05; margin-bottom: 20px; }
.hero-h1 em { font-style: italic; color: var(--lime); }
.section { margin-bottom: 64px; }
.panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 24px 28px; margin-bottom: 20px; }
.field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
input { background: var(--bg3); border: 1px solid var(--border2); border-radius: 4px; color: var(--text0); padding: 10px; width: 100%; }
.btn { font-family: var(--mono); padding: 10px 20px; border-radius: 4px; cursor: pointer; border: none; font-weight: 500; }
.btn-lime { background: var(--lime); color: #111; }
.btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--text1); }
.vblock { border-radius: 6px; padding: 28px; margin-bottom: 28px; border: 1px solid; }
.vblock.u { background: var(--green-dim); border-color: #4ade804d; }
.vblock.o { background: var(--red-dim); border-color: #f871714d; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 28px; }
.scard { background: var(--bg2); border: 1px solid var(--border); padding: 16px; border-radius: 6px; }
.dt { width: 100%; border-collapse: collapse; margin-top: 10px; }
.dt td, .dt th { padding: 8px; border-bottom: 1px solid var(--border); text-align: right; }
.dt th { color: var(--text2); font-size: 10px; text-transform: uppercase; }
.hidden { display: none; }
</style>
</head>
<body>

<nav id="topbar">
  <a href="#" class="logo">
    <div class="logo-box">IV</div>
    <span class="logo-text">Intrinsic<b>Value</b></span>
  </a>
  <div class="topbar-right">
    <span id="tb-version"></span>
    <a href="settings.html" style="color:var(--text2); text-decoration:none;">⚙ Settings</a>
    <span id="tb-clock"></span>
  </div>
</nav>

<div id="page">
  <section class="section">
    <h1 class="hero-h1" id="hero-h1">Stock Valuation <em>Terminal</em></h1>
    <p style="color:var(--text1); max-width: 600px; margin-bottom: 24px;">Advanced DCF model with Mid-Year Convention. Data provided by Massive & FMP.</p>
    
    <div class="panel">
      <div style="display:flex; gap:10px;">
        <input type="text" id="inp-ticker" placeholder="ENTER TICKER (E.G. NVDA)" style="text-transform:uppercase;">
        <button class="btn btn-lime" onclick="go()">FETCH DATA</button>
      </div>
    </div>
  </section>

  <div id="status"></div>

  <section class="section hidden" id="sec-ass">
    <div class="panel">
        <h3 style="margin-bottom:15px; color:var(--lime);">Model Assumptions</h3>
        <div class="field-grid">
            <div class="field">
                <label>Base FCF (M USD)</label>
                <input type="number" id="i-fcf">
            </div>
            <div class="field">
                <label>WACC (%)</label>
                <input type="number" id="i-wacc" step="0.1" value="10.0">
            </div>
            <div class="field">
                <label>Terminal Growth (%)</label>
                <input type="number" id="i-tg" step="0.1" value="2.5">
            </div>
            <div class="field">
                <label>Shares (M)</label>
                <input type="number" id="i-shares">
            </div>
            <div class="field">
                <label>Net Debt (M)</label>
                <input type="number" id="i-debt">
            </div>
        </div>
        <div style="margin-top:20px;">
            <button class="btn btn-lime" onclick="runDCF()">CALCULATE VALUE</button>
        </div>
    </div>
  </section>

  <section class="section hidden" id="sec-results">
    <div id="vblock" class="vblock">
      <div id="vh" style="font-size:24px; font-family:var(--serif);"></div>
      <div id="vsub" style="margin-top:10px; color:var(--text1);"></div>
    </div>

    <div class="stats-grid" id="stat-grid"></div>

    <div class="panel">
        <h4 style="color:var(--text2); text-transform:uppercase; font-size:10px; margin-bottom:15px;">Cash Flow Projection (Mid-Year Discounting)</h4>
        <table class="dt">
            <thead>
                <tr><th>Year</th><th>FCF (M)</th><th>Discount Factor</th><th>Present Value</th></tr>
            </thead>
            <tbody id="proj-body"></tbody>
        </table>
    </div>
  </section>
</div>

<script>
// --- CORE LOGIC IMPROVEMENTS ---

let G = {}; // Global data store

async function go() {
    const ticker = document.getElementById('inp-ticker').value.trim().toUpperCase();
    if(!ticker) return;
    
    stat('loading', `Accessing terminals for ${ticker}...`);
    try {
        // Hier gebruiken we jouw bestaande fetchMassive functie logica
        // Voor de demo vul ik even dummy data in als de API niet reageert
        G = await fetchMassive(ticker, localStorage.getItem('iv_massive_key'));
        fillFields(G);
        document.getElementById('sec-ass').classList.remove('hidden');
        stat('success', `Data for ${ticker} loaded.`);
    } catch(e) {
        stat('error', e.message);
    }
}

function fillFields(d) {
    document.getElementById('i-fcf').value = d.fcf;
    document.getElementById('i-shares').value = Math.round(d.sharesM);
    document.getElementById('i-debt').value = d.netDebt;
}

    // 1. Inputs ophalen
    const fcf = parseFloat(document.getElementById('i-fcf').value);

    const shares = parseFloat(document.getElementById('i-shares').value);
    const debt = parseFloat(document.getElementById('i-debt').value);

        return;
